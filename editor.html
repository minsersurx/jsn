<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页内容编辑器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <main class="editor-shell">
        <header class="editor-header">
            <a class="back-link" href="index.html"><i class="fas fa-arrow-left"></i> 返回网页</a>
            <h1>网页内容编辑器</h1>
            <p>填写下面的表单后点击“保存内容”。内容会保存在当前浏览器，并可导出给我上传到 GitHub。</p>
        </header>

        <form id="contentForm">
            <section class="form-card">
                <h2><i class="fas fa-image"></i> 1. 封面</h2>
                <label>主标题<input name="coverTitle" value="封面大标题"></label>
                <label>副标题<input name="coverSubtitle" value="副标题 1 · 副标题 2 · 副标题 3"></label>
            </section>

            <section class="form-card">
                <h2><i class="fas fa-envelope-open-text"></i> 2. 生日信</h2>
                <label>信件标题<input name="letterTitle" value="信件标题"></label>
                <label>信件内容<textarea name="letterBody" rows="6">这里是你的长篇信件内容。</textarea></label>
                <label>署名<input name="letterSignature" value="署名"></label>
            </section>

            <section class="form-card">
                <h2><i class="fas fa-timeline"></i> 3. 时间轴</h2>
                <label>时间轴标题<input name="timelineTitle" value="时间轴大标题"></label>
                <div class="repeat-grid">
                    <fieldset><legend>事件 1</legend><label>日期<input name="timeline1Date" value="2023.01.01"></label><label>标题<input name="timeline1Title" value="第一个纪念日"></label><label>内容<textarea name="timeline1Body" rows="3">填回你的内容填回你的内容填回你的内容填回你的内容。</textarea></label></fieldset>
                    <fieldset><legend>事件 2</legend><label>日期<input name="timeline2Date" value="2023.06.01"></label><label>标题<input name="timeline2Title" value="第二个纪念日"></label><label>内容<textarea name="timeline2Body" rows="3">填回你的内容填回你的内容填回你的内容填回你的内容。</textarea></label></fieldset>
                    <fieldset><legend>事件 3</legend><label>日期<input name="timeline3Date" value="2024.01.01"></label><label>标题<input name="timeline3Title" value="新的开始"></label><label>内容<textarea name="timeline3Body" rows="3">填回你的内容填回你的内容填回你的内容填回你的内容。</textarea></label></fieldset>
                </div>
            </section>

            <section class="form-card">
                <h2><i class="fas fa-images"></i> 4. 照片墙</h2>
                <label>照片墙标题<input name="photoTitle" value="照片墙大标题"></label>
                <p class="hint">照片路径可以填写项目内路径，例如 <code>images/photo1.jpg</code>。图片文件仍需要放进项目的 images 文件夹后再交给我上传。</p>
                <div class="repeat-grid">
                    <fieldset><legend>照片 1</legend><label>图片路径<input name="photo1Src" value="images/photo1.jpg"></label><label>替代文字<input name="photo1Alt" value="图片 1"></label><label>说明<input name="photo1Caption" value="照片说明 1"></label><label>故事<textarea name="photo1Story" rows="3">你的照片故事1你的照片故事1你的照片故事1。</textarea></label></fieldset>
                    <fieldset><legend>照片 2</legend><label>图片路径<input name="photo2Src" value="images/photo2.jpg"></label><label>替代文字<input name="photo2Alt" value="图片 2"></label><label>说明<input name="photo2Caption" value="照片说明 2"></label><label>故事<textarea name="photo2Story" rows="3">你的照片故事2你的照片故事2你的照片故事2。</textarea></label></fieldset>
                    <fieldset><legend>照片 3</legend><label>图片路径<input name="photo3Src" value="images/photo3.jpg"></label><label>替代文字<input name="photo3Alt" value="图片 3"></label><label>说明<input name="photo3Caption" value="照片说明 3"></label><label>故事<textarea name="photo3Story" rows="3">你的照片故事3你的照片故事3你的照片故事3。</textarea></label></fieldset>
                    <fieldset><legend>照片 4</legend><label>图片路径<input name="photo4Src" value="images/photo4.jpg"></label><label>替代文字<input name="photo4Alt" value="图片 4"></label><label>说明<input name="photo4Caption" value="照片说明 4"></label><label>故事<textarea name="photo4Story" rows="3">你的照片故事4你的照片故事4你的照片故事4。</textarea></label></fieldset>
                </div>
            </section>

            <section class="form-card">
                <h2><i class="fas fa-align-center"></i> 5. 页脚</h2>
                <label>页脚寄语<textarea name="footerText" rows="3">“页脚寄语。永远期待下一个明天。”</textarea></label>
            </section>

            <section class="form-card">
                <h2><i class="fas fa-address-card"></i> 6. 联络信息</h2>
                <p class="hint">社交平台按钮只显示平台名称，不会显示用户名。这里填写的账号用于生成链接。</p>
                <div class="contact-form-grid">
                    <label>QQ 号码<input name="qq" value="2700448977"></label>
                    <label>邮件链接<input name="emailLink" value=""></label>
                    <label>WhatsApp<input name="whatsapp" value="+852 66606054"></label>
                    <label>Telegram 用户名<input name="telegram" value="genyuu0817"></label>
                    <label>Facebook 链接<input name="facebook" value="https://www.facebook.com/share/1RofTqxQ6v/"></label>
                    <label>X 用户名<input name="xUsername" value="yuusea0817"></label>
                    <label>Instagram 用户名<input name="instagram" value="wolflingvolant"></label>
                    <label>抖音账号<input name="douyin" value="75406790697"></label>
                    <label>中国电话<input name="phoneChina" value="+8613508097694"></label>
                    <label>英国电话<input name="phoneUk" value="+447955851786"></label>
                    <label>香港电话<input name="phoneHk" value="+85266606054"></label>
                </div>
            </section>

            <div class="editor-actions">
                <button type="submit" class="primary"><i class="fas fa-save"></i> 保存内容</button>
                <button type="button" id="exportButton" class="secondary"><i class="fas fa-download"></i> 导出内容文件</button>
                <button type="button" id="resetButton" class="text-button">恢复默认</button>
                <span id="saveStatus" role="status"></span>
            </div>
        </form>

        <footer class="editor-footer">填写完成后，如果需要我正式上传，请把导出的内容文件和新增照片一起发给我。</footer>
    </main>
    <script src="js/editor.js"></script>
</body>
</html>
