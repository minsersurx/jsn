	<main class="letter-content">
		<h1>致我最亲爱的你</h1>
		
		<p>一直想找个机会，把心里的这些话写下来。虽然我们每天都在聊天，但有些情感，似乎只有通过文字，才能表达得更完整。</p>
		
		<p>认识你的这段时间，是我人生中最快乐的日子。你总是能看穿我的小情绪，用你的方式包容我、温暖我。</p>
		
		<p>未来还有很长的路要走，我想牵着你的手，一起去看不一样的风景。只要有你在身边，我就什么都不怕。</p>
		
		<div class="letter-signature">
			<p>永远爱你的</p>
			<p>2024年X月X日</p>
		</div>
	</main>
